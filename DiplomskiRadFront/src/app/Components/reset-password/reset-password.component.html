<div class="container-fluid pt-5">
  <div class="text-center mb-4">
    <h2 class="section-title px-5"><span class="px-2">Reset Password</span></h2>
  </div>
  <div class="row px-xl-5 justify-content-center">
    <div class="col-lg-4 mb-5">
      <div *ngIf="errorMessage && !token" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <form
        *ngIf="token"
        [formGroup]="form"
        (ngSubmit)="submit()"
        class="login-form"
        novalidate
      >
        <div class="control-group">
          <input
            type="password"
            class="form-control"
            placeholder="New password"
            formControlName="newPassword"
          />
          <div class="field-error text-danger">
            <span
              *ngIf="
                form.get('newPassword')?.invalid &&
                form.get('newPassword')?.touched
              "
              >Minimum eight characters, at least one letter and one
              number.</span
            >
          </div>
        </div>
        <div class="control-group">
          <input
            type="password"
            class="form-control"
            placeholder="Confirm new password"
            formControlName="confirmPassword"
          />
          <div class="field-error text-danger">
            <span
              *ngIf="
                form.get('confirmPassword')?.invalid &&
                form.get('confirmPassword')?.touched
              "
              >Please confirm your new password.</span
            >
          </div>
        </div>
        <button
          class="btn btn-primary py-2 px-4"
          type="submit"
          [disabled]="loading"
        >
          <span
            *ngIf="loading"
            class="spinner-border spinner-border-sm mr-1"
          ></span>
          Set new password
        </button>
      </form>

      <p class="mt-3"><a routerLink="/login">Back to login</a></p>
    </div>
  </div>
</div>

<app-admin-nav></app-admin-nav>

<div class="container-fluid pb-5">
  <div class="row px-xl-5">
    <div class="col-12">
      <div class="card shadow-sm mb-4">
        <div
          class="card-header d-flex flex-wrap align-items-center justify-content-between bg-white"
        >
          <h5 class="mb-0">
            <i class="fas fa-paper-plane text-primary mr-2"></i>Newsletter
            Subscribers
          </h5>
        </div>

        <div class="card-body border-top">
          <div class="input-group" style="max-width: 320px">
            <input
              class="form-control"
              placeholder="Search by e-mail"
              [(ngModel)]="keyword"
              (keyup.enter)="search()"
            />
            <div class="input-group-append">
              <button class="btn btn-outline-secondary" (click)="search()">
                <i class="fa fa-search"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="text-center py-5" *ngIf="loading && !dataLoaded">
          <span class="spinner-border text-primary"></span>
        </div>

        <div
          class="card-body"
          *ngIf="dataLoaded && !loading && subscribers.length === 0"
        >
          <p class="text-muted mb-0">No subscribers yet.</p>
        </div>

        <div
          class="table-responsive position-relative"
          [class.is-refreshing]="loading && dataLoaded"
          *ngIf="dataLoaded && subscribers.length > 0"
        >
          <div class="refresh-overlay" *ngIf="loading">
            <span class="spinner-border spinner-border-sm text-primary"></span>
          </div>
          <table class="table table-hover mb-0 align-middle">
            <thead class="thead-light">
              <tr>
                <th>Email</th>
                <th>Subscribed on</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let s of subscribers">
                <td>{{ s.email }}</td>
                <td>{{ s.createdAt | date: "medium" }}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

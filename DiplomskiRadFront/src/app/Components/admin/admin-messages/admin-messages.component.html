<app-admin-nav></app-admin-nav>

<div class="container-fluid pb-5">
  <div class="row px-xl-5">
    <div class="col-12">
      <div class="card shadow-sm mb-4">
        <div
          class="card-header d-flex flex-wrap align-items-center justify-content-between bg-white"
        >
          <h5 class="mb-0">
            <i class="fas fa-envelope text-primary mr-2"></i>Messages
          </h5>
          <div class="d-flex align-items-center" style="gap: 1rem">
            <div class="d-flex align-items-center">
              <label class="mr-2 mb-0 text-muted small">Status:</label>
              <select
                class="form-control form-control-sm"
                style="max-width: 150px"
                [(ngModel)]="answeredFilter"
                (ngModelChange)="loadMessages()"
              >
                <option value="all">All</option>
                <option value="answered">Answered</option>
                <option value="unanswered">Unanswered</option>
              </select>
            </div>
            <div class="custom-control custom-checkbox">
              <input
                type="checkbox"
                class="custom-control-input"
                id="includeInactiveMessages"
                [(ngModel)]="includeInactive"
                (change)="loadMessages()"
              />
              <label class="custom-control-label" for="includeInactiveMessages"
                >Show deleted messages</label
              >
            </div>
          </div>
        </div>

        <div class="card-body border-top">
          <div class="input-group" style="max-width: 320px">
            <input
              class="form-control"
              placeholder="Search by name, email, subject"
              [(ngModel)]="keyword"
              (keyup.enter)="search()"
            />
            <div class="input-group-append">
              <button class="btn btn-outline-secondary" (click)="search()">
                <i class="fa fa-search"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="text-center py-5" *ngIf="loading && !dataLoaded">
          <span class="spinner-border text-primary"></span>
        </div>

        <div
          class="card-body"
          *ngIf="dataLoaded && !loading && messages.length === 0"
        >
          <p class="text-muted mb-0">No messages yet.</p>
        </div>

        <div
          class="list-group list-group-flush position-relative"
          [class.is-refreshing]="loading && dataLoaded"
          *ngIf="dataLoaded"
        >
          <div class="refresh-overlay" *ngIf="loading">
            <span class="spinner-border spinner-border-sm text-primary"></span>
          </div>
          <div
            class="list-group-item"
            *ngFor="let m of messages"
            [class.bg-light]="!m.isActive"
          >
            <div
              class="d-flex flex-wrap align-items-center justify-content-between message-header"
              (click)="toggleExpand(m.id)"
            >
              <div class="d-flex align-items-center flex-grow-1">
                <i
                  class="fas mr-2"
                  [ngClass]="
                    expandedMessageId === m.id
                      ? 'fa-chevron-down'
                      : 'fa-chevron-right'
                  "
                ></i>
                <div>
                  <span class="font-weight-bold">{{ m.subject }}</span>
                  <span class="badge badge-secondary ml-2" *ngIf="!m.isActive"
                    >Deleted</span
                  >
                  <span class="badge badge-success ml-2" *ngIf="m.isAnswered"
                    >Answered</span
                  >
                  <span class="badge badge-warning ml-2" *ngIf="!m.isAnswered"
                    >Unanswered</span
                  >
                  <div class="small text-muted">
                    <i class="fas fa-user mr-1"></i>{{ m.name }} &lt;{{
                      m.email
                    }}&gt;
                    <span class="ml-2">{{ m.createdAt | date: "medium" }}</span>
                  </div>
                </div>
              </div>
              <div class="d-flex align-items-center">
                <button
                  class="btn btn-sm"
                  [ngClass]="
                    m.isActive ? 'btn-outline-danger' : 'btn-outline-success'
                  "
                  (click)="
                    $event.stopPropagation(); deleteMessage(m.id, m.isActive)
                  "
                >
                  <i
                    class="fas"
                    [ngClass]="m.isActive ? 'fa-trash' : 'fa-undo'"
                  ></i>
                  {{ m.isActive ? "Delete" : "Restore" }}
                </button>
              </div>
            </div>
            <div class="mt-3 message-body" *ngIf="expandedMessageId === m.id">
              <p class="mb-3">{{ m.message }}</p>

              <div class="border-top pt-3" *ngIf="m.isAnswered">
                <h6 class="text-success">
                  <i class="fas fa-reply mr-1"></i>Answer
                  <span
                    class="text-muted small font-weight-normal"
                    *ngIf="m.answeredAt"
                    >- answered {{ m.answeredAt | date: "medium" }}</span
                  >
                </h6>
                <p class="mb-0">{{ m.answer }}</p>
              </div>

              <div
                class="border-top pt-3"
                *ngIf="!m.isAnswered"
                [formGroup]="answerForm"
              >
                <h6>Reply to this message</h6>
                <textarea
                  class="form-control"
                  rows="3"
                  formControlName="answer"
                  [class.is-invalid]="
                    answerForm.get('answer')?.invalid &&
                    answerForm.get('answer')?.touched
                  "
                  placeholder="Write your answer..."
                ></textarea>
                <div class="field-error text-danger">
                  <span
                    *ngIf="
                      answerForm.get('answer')?.invalid &&
                      answerForm.get('answer')?.touched
                    "
                    >Answer must be at least 3 characters.</span
                  >
                </div>
                <button
                  class="btn btn-primary btn-sm mt-2"
                  [disabled]="answering"
                  (click)="submitAnswer(m.id)"
                >
                  <span
                    class="spinner-border spinner-border-sm mr-1"
                    *ngIf="answering"
                  ></span>
                  Send answer
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

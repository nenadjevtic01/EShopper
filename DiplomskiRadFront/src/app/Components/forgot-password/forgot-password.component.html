<div class="container-fluid pt-5">
  <div class="text-center mb-4">
    <h2 class="section-title px-5">
      <span class="px-2">Forgot Password</span>
    </h2>
  </div>
  <div class="row px-xl-5 justify-content-center">
    <div class="col-lg-4 mb-5">
      <div *ngIf="!submitted" class="login-form">
        <p class="text-muted mb-4">
          Enter your account email and, if it exists, we'll send you a link to
          reset your password.
        </p>
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="control-group">
            <input
              type="email"
              class="form-control"
              placeholder="Your Email"
              formControlName="email"
            />
            <div class="field-error text-danger">
              <span
                *ngIf="form.get('email')?.invalid && form.get('email')?.touched"
                >A valid email is required.</span
              >
            </div>
          </div>
          <button
            class="btn btn-primary py-2 px-4"
            type="submit"
            [disabled]="loading"
          >
            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm mr-1"
            ></span>
            Send reset link
          </button>
        </form>
      </div>

      <div *ngIf="submitted" class="alert alert-success">
        <i class="fas fa-envelope mr-1"></i>
        If an account with that email exists, we've sent instructions to reset
        the password.
      </div>

      <p class="mt-3"><a routerLink="/login">Back to login</a></p>
    </div>
  </div>
</div>
